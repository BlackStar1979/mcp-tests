name: OAuth21 Resource Fix Verification

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pull-requests: write

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          show-progress: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --silent

      - name: Check changed JavaScript syntax
        run: |
          node --check src/auth/auth_oauth.js
          node --check src/auth/auth_policy.js
          node --check src/auth/oauth21_mcp_authorization_server.js
          node --check src/runtime/create_server_route_dispatcher.js
          node --check src/runtime/oauth_metadata.js
          node --check src/runtime/server_bootstrap_runtime.js
          node --check _tests/smoke_oauth21_resource_binding.js
          node --check _tests/smoke_oauth21_local_as_flow.js

      - name: Run focused OAuth21 resource tests
        run: |
          node _tests/smoke_oauth21_resource_binding.js
          node _tests/smoke_oauth21_local_as_flow.js
          node _tests/smoke_oauth21_runtime_status_response.js

  full-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          show-progress: false

      - name: Install dependencies
        run: npm ci --silent

      - name: Run full offline smoke suite
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set +e
          npm test > full-suite.log 2>&1
          status=$?
          tail -n 40 full-suite.log
          if [ "$status" -ne 0 ]; then
            {
              echo "Full offline smoke suite failed on commit $GITHUB_SHA."
              echo
              echo '```text'
              tail -n 80 full-suite.log
              echo '```'
            } > failure-comment.md
            gh pr comment "$PR_NUMBER" --body-file failure-comment.md
          fi
          exit $status
