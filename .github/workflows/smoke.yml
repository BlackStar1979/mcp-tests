name: smoke

# The suite assumes the production layout: workspace root C:\Work containing mcp-tests
# (tests resolve bare workspace paths such as "mcp-tests" against C:\Work, and several assert
# that root literally). So the job copies the checkout to C:\Work\LocalNodeMCP and runs it there,
# on Windows, exactly as the workstation does.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          path: mcp-tests

      - uses: actions/setup-node@v5
        with:
          node-version: "26.8.1"

      - name: Place the repository at its production path
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force C:\Work | Out-Null
          robocopy "$env:GITHUB_WORKSPACE\mcp-tests" C:\Work\LocalNodeMCP /E /NFL /NDL /NJH /NJS /NP
          if ($LASTEXITCODE -ge 8) { exit $LASTEXITCODE }
          exit 0

      - name: Install pinned dependencies
        working-directory: C:\Work\LocalNodeMCP
        run: npm ci --no-audit --no-fund

      - name: Dependency audit (high and above fails)
        working-directory: C:\Work\LocalNodeMCP
        run: npm audit --audit-level=high

      - name: Full smoke suite
        working-directory: C:\Work\LocalNodeMCP
        run: node _tests/run_all_smokes.js --skip-network
